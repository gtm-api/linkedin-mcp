# gtm.mcp - Cloudflare Worker.
#
# TWO environments, and the default one is NOT deployable on purpose:
#   default        `wrangler dev` on :8788. No cloud bindings at all.
#   env.production `pnpm deploy:production` -> https://mcp.gtm-api.com
# Full walkthrough, in order and marked by who runs each step: ../../DEPLOY.md.
# `pnpm deploy:preflight` refuses the deploy while a placeholder below is still
# unfilled, so read that failure rather than this file.
#
# There is deliberately no `staging` env. It used to exist as a second worker
# script on workers.dev, and it was the wrong shape: it pointed at the SAME beta
# backends as production (there is no backend staging tier), so every write it
# made was a production write, which is the one thing a staging env is supposed
# to protect you from. Eugene's decision (2026-07-27) is that local development
# keeps using local services, which leaves nobody who would develop against it.
# What it was actually good for - not letting the first `wrangler deploy` this
# project ever runs be the public one - is now done by a VERSION: DEPLOY.md step
# 9 uploads the production config as an undeployed version, smokes its preview
# URL with `pnpm smoke`, and only then promotes it. That rehearses the bytes that
# go live instead of a different worker that resembles them.
#
# Analytics Engine lands in a later stage. COMMIT_TOKENS (preview gate) is
# local-simulated under `wrangler dev`; a real namespace id is set before the
# deploy. The [[ratelimits]] bindings are production-only on purpose: with none
# bound, the rate-limit gate falls back to an isolate-local counter, which is
# what keeps `wrangler dev` offline.
name = "gtm-mcp-dev"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
# The default env is not meant to be published, and this is the guard rail: a
# bare `wrangler deploy` (no --env) would otherwise put `gtm-mcp-dev` on the
# account's workers.dev subdomain, with no rate-limit bindings and a KV id that
# does not exist. With this false it uploads a worker nothing routes to.
workers_dev = false

[dev]
port = 8788

[observability]
enabled = true

[[kv_namespaces]]
binding = "COMMIT_TOKENS"
id = "gtm_mcp_commit_tokens_local"

# ── production ──────────────────────────────────────────────────────────────
# Deployed with `pnpm deploy:production` - full walkthrough in ../../DEPLOY.md.
# AI + Vectorize bindings exist ONLY here: their absence in the default (dev)
# env is what keeps `wrangler dev` fully local - the support KB falls back to
# the bundled BM25 index (see mcp.support/kb_articles).
[env.production]
name = "gtm-mcp"
# CUSTOM DOMAIN, not a route, and the difference is not cosmetic.
#
#   custom_domain = true  -> the Worker OWNS the hostname. Cloudflare creates
#     the (proxied, Workers-managed) DNS record for mcp.gtm-api.com itself,
#     issues the edge certificate, and sends every request on that hostname to
#     this Worker. There is no origin behind it, which is exactly our case: the
#     worker IS the server, it answers /health, /.well-known/... and /mcp/*.
#   { pattern = "mcp.gtm-api.com/*", zone_name = "gtm-api.com" } -> a ROUTE.
#     A route puts a Worker IN FRONT of a zone's existing origin. It does not
#     create DNS: the hostname still has to resolve through a proxied record
#     somewhere, and with no origin behind it the usual trick is a dummy AAAA
#     100:: record whose only purpose is to give Cloudflare something to attach
#     the orange cloud to. That is a second moving part which exists only to be
#     ignored, and forgetting it is the classic "the route is configured and the
#     hostname still 1016s" failure.
#
# So: a Worker that answers on its own hostname takes a custom domain. Routes
# are for a Worker that intercepts paths on a hostname something else serves,
# which is what app.gtm-api.com is (OpenResty, the Laravel gateway) and is
# precisely why the MCP worker gets its own subdomain rather than a path there.
#
# The pattern is a bare hostname: a custom domain accepts no path and no
# wildcard. Wrangler creates the record on `wrangler deploy`; a pre-existing
# mcp.gtm-api.com record makes that fail until it is deleted (DEPLOY.md step 7).
# Requires gtm-api.com to be a zone in the SAME Cloudflare account (it is - the
# zone's SSL/TLS mode is what caused the app.gtm-api.com redirect loop in July).
routes = [{ pattern = "mcp.gtm-api.com", custom_domain = true }]
# No second public entrance. With workers_dev = true the worker would ALSO
# answer on gtm-mcp.<account>.workers.dev, a stable guessable hostname that is
# not the one MCP_RESOURCE_URL names, so the discovery document and the aud
# check would describe a different URL from the one being called.
workers_dev = false
# Version preview URLs stay ON, and they are load-bearing rather than a leftover:
# `wrangler versions upload` prints
# https://<8-char-version>-gtm-mcp.<account>.workers.dev for a version that has
# been uploaded but NOT deployed, carrying these exact vars, bindings and
# secrets. That is the pre-production rehearsal that replaces the deleted
# staging env (DEPLOY.md step 9). Wrangler warns on this combination ("you are
# disabling workers.dev but Preview URLs are still enabled") - that warning is
# the intended state, not a mistake to fix. The URL is unguessable in practice
# and runs the same auth checks; it is not an unauthenticated surface.
preview_urls = true

[env.production.observability]
enabled = true

# Console output additionally streams to the gtm-mcp-tail tail consumer
# (apps/tail-loki), which pushes it to the platform's Grafana Cloud Loki: the
# per-call wide events become queryable next to the copilot's and the backends'
# logs, and external MCP sessions get a Grafana footprint at all. That worker
# must be deployed BEFORE this env - a tail binding to a missing service fails
# the deploy.
[[env.production.tail_consumers]]
service = "gtm-mcp-tail"

[env.production.vars]
ENV_NAME = "production"
# Not 'dev' in any deployed env: AUTH_MODE=dev accepts the server-side DEV_BEARER
# instead of a client token, and config.ts refuses to serve if it sees it here.
AUTH_MODE = "jwt"
# Public base URLs of the backend services as reachable FROM Cloudflare's edge.
#
# The edge is the id host's OpenResty, path-routing /{svc}/v4 on ONE domain and
# stripping the prefix before Laravel sees the request. Source of truth is
# `gateway_routes` + `gateway_server_name` in the ansible repo
# (product/deployment/gtm.deployment.ansible/host_vars/id-beta.yml), NOT
# product/deployment/README.md, which still says the apex `gtm-api.com`. The
# apex is the WordPress landing on DigitalOcean; the API edge is the `app.`
# host, and `app_url: "https://app.gtm-api.com/id/v4"` in the same host_vars
# confirms it. buildRequest() does `base.replace(/\/$/,'') + pathTemplate`, so a
# path prefix on the base survives and /api/... lands correctly behind it.
LINKEDIN_BASE_URL = "https://app.gtm-api.com/linkedin/v4"
ID_BASE_URL = "https://app.gtm-api.com/id/v4"
# This one is not just the orchestration mounts: /mcp/orchestration/webhooks and
# /mcp/orchestration/mass-actions are mounted, so requiredBaseUrlServices()
# includes 'orchestration' and an unusable value here is FATAL - /health and
# EVERY mount answer 503, a total outage rather than a partial one.
#
# Filled on 2026-07-27, once the /orchestration/v4 entry in `gateway_routes`
# (host_vars/id-beta.yml) stopped being commented out. It is a CONFIG value here
# and a DEPLOY dependency out there, and the two are not the same date: the
# ansible change is in the working tree, the orchestration box (65.109.84.210)
# has never been provisioned, and `provision-id.yml --tags gateway` has not been
# re-run. Until both happen the prefix answers 404 (route not published) or 502
# (published, no app behind it). That is the failure the preflight's edge phase
# exists to catch: it GETs {this}/live before any deploy and refuses on either,
# so the ordering error surfaces on the laptop instead of as a green /health
# with every orchestration tool 502ing at dispatch.
# Sequence and owner: product/deployment/RUNBOOK-orchestration.md § 3.
ORCHESTRATION_BASE_URL = "https://app.gtm-api.com/orchestration/v4"
# OAuth resource-server identity. With AUTH_MODE=jwt these are REQUIRED: without
# them the iss and aud checks would have nothing to compare against, so the
# worker refuses every request with 503 and /health says which one is missing.
# They are also the whole content of the discovery document.
#
# ONE value does both jobs now, and it used to be unfillable because it could
# not: verifier.ts does an exact `payload.iss !== auth.issuer` match, while the
# discovery document has to publish an RFC 8414 base. id set no `iss` claim, so
# jwt-auth's Claims/Factory::iss() returned `$this->request->url()` - the URL of
# the MINTING ENDPOINT, and behind the prefix-stripping gateway not even a URL
# that routes back to id ("https://app.gtm-api.com/auth/login", measured).
#
# Landed 2026-07-27 (Eugene's decision): id mints an EXPLICIT issuer -
# `config('jwt.issuer')` in gtm.service.id, defaulting to APP_URL, applied at the
# claim factory (App\Auth\IssuerClaimFactory) so every minting path emits it -
# and OAuthFlowController::issuer() reads the same key. Token `iss`, RFC 8414
# `issuer` and RFC 9728 `authorization_servers[0]` are now the one string below,
# which is why AUTH_ISSUER needs no second variable and no normalisation.
#
# 🛑 THE ID DEPLOY IS THE PRECONDITION FOR THIS WORKER'S DEPLOY. A host still
# running the pre-issuer id mints tokens whose `iss` is a per-endpoint URL, and
# this exact-match check 401s every one of them with "issuer mismatch". Deploy
# gtm.service.id first, then verify against the live host before promoting the
# worker version:
#   curl -s https://app.gtm-api.com/id/v4/.well-known/oauth-authorization-server
# must answer `"issuer":"https://app.gtm-api.com/id/v4"`, and a real login token
# from that host must carry the same string in `iss` (base64url-decode the
# payload). Both were verified locally against the running id container before
# this value was filled in; the beta host is Eugene's to deploy.
AUTH_ISSUER = "https://app.gtm-api.com/id/v4"
# This worker's own public MCP URL: the custom domain above plus the unified
# facade mount (mounts.config.ts, path '/mcp'). It is not a lookup and not a
# first-deploy echo any more - the hostname is ours by decision, so this is
# derived from `routes` and the preflight enforces that they agree. It is both
# the `resource` of the OAuth discovery document and the value a token's `aud`
# must carry, so it names the URL clients actually POST to.
MCP_RESOURCE_URL = "https://mcp.gtm-api.com/mcp"
# Abuse + cost controls. These two numbers MUST stay equal to the `simple.limit`
# of the matching [[ratelimits]] binding below: the binding is what enforces,
# the var is what the error message quotes back to the agent, and an agent told
# to wait for a ceiling that is not the real one will retry into a wall.
RATE_LIMIT_CALLS_PER_WINDOW = "600"
RATE_LIMIT_WRITES_PER_WINDOW = "120"
RATE_LIMIT_WINDOW_SECONDS = "60"
MAX_BATCH_SIZE = "16"

[[env.production.kv_namespaces]]
binding = "COMMIT_TOKENS"
# An account-scoped resource id that only exists once someone creates it.
# Supplied by: Eugene, by pasting the id echoed by
# `wrangler kv namespace create COMMIT_TOKENS --env production` (DEPLOY.md step 4).
# Unfilled it is a WARNING to the worker (it serves reads and every dangerous
# tool refuses at the confirm step, fail-closed) and a BLOCKER to the preflight.
id = "b6732a731e8c443b9bf6438d9aeccd26"

# Platform rate limiting. `namespace_id` is ours to choose and only has to be
# unique per worker; it is NOT a resource to create beforehand, so unlike the KV
# id above there is no TODO here. `period` accepts 10 or 60 and nothing else.
# Counters are per colo, so a caller spread over many colos gets a multiple of
# the nominal limit; the numbers exist to stop a storm, not to meter billing.
[[env.production.ratelimits]]
name = "RATE_LIMIT_CALLS"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[env.production.ratelimits]]
name = "RATE_LIMIT_WRITES"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
